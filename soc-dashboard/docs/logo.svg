<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#1a2238"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d2d"/>
      <stop offset="1" stop-color="#b50f0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feOffset in="b" dx="0" dy="4" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <circle cx="256" cy="268" r="200" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#4ea8ff" stroke-width="2" fill="none">
    <circle cx="256" cy="268" r="60"/>
    <circle cx="256" cy="268" r="110"/>
    <circle cx="256" cy="268" r="160"/>
    <line x1="56" y1="268" x2="456" y2="268"/>
    <line x1="256" y1="68" x2="256" y2="468"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M256 90
             L384 128
             L384 268
             C384 348 328 410 256 440
             C184 410 128 348 128 268
             L128 128 Z"
          fill="url(#shield)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1"/>
  </g>

  <path d="M160 280
           L200 280
           L218 240
           L246 320
           L272 220
           L298 300
           L318 268
           L352 268"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="352" cy="268" r="10" fill="#00ff88" stroke="#ffffff" stroke-width="3"/>

  <text x="256" y="400" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="#ffffff" letter-spacing="4">SOC</text>
</svg>
