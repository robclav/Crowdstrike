name: 🐛 Bug report
description: Report a problem with the application
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the fields below so we can reproduce it quickly.
  - type: input
    id: version
    attributes:
      label: App version
      description: Which version of the `.tar.gz` did you install? (e.g. `v0.26.33`)
      placeholder: v0.26.33
    validations:
      required: true
  - type: input
    id: cloud
    attributes:
      label: Falcon cloud / region
      description: us-1 / us-2 / eu-1 / us-gov-1
      placeholder: us-2
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Problem description
      description: What happens? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Go to the Network Map view
        3. Error appears...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
      description: Optional but useful. **Do not include sensitive data** (asset IDs, internal IPs, real hostnames).
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label: I have verified my report contains no credentials, tokens, internal IPs, or real host identifiers.
          required: true
