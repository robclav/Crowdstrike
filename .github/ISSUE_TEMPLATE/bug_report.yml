name: 🐛 Bug report
description: Reporta un problema con la aplicación
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug. Rellena los campos para que podamos reproducirlo rápidamente.
  - type: input
    id: version
    attributes:
      label: Versión de la app
      description: ¿Qué versión del `.tar.gz` instalaste? (p. ej. `v0.26.33`)
      placeholder: v0.26.33
    validations:
      required: true
  - type: input
    id: cloud
    attributes:
      label: Falcon cloud / región
      description: us-1 / us-2 / eu-1 / us-gov-1
      placeholder: us-2
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Descripción del problema
      description: ¿Qué ocurre? ¿Qué esperabas que ocurriese?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abro la app
        2. Voy a la vista Network Map
        3. Veo el error...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Capturas / logs
      description: Opcional pero útil. **No incluyas datos sensibles** (asset IDs, IPs internas, hostnames reales).
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmación
      options:
        - label: He revisado que mi reporte no contiene credenciales, tokens, IPs internas ni identificadores de hosts reales.
          required: true
